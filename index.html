<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost Latitudes - Becker, Bellamy & James</title>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #d4a373;
      --text-color: #f4f1de;
      --text-muted: #a0a0a0;
      --border-color: #2a2a2a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
    }

    .album-container {
      max-width: 650px;
      margin: 0 auto;
    }

    /* Wavekit Playlist Container */
    .wavekit-embed-box {
      margin-bottom: 20px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      min-height: 380px;
    }

    .wavekit-embed-box iframe {
      width: 100%;
      height: 380px;
      border: none;
      display: block;
    }

    /* Custom Tracklist items */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .track-info {
      flex-grow: 1;
    }

    .track-title {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 2px 0;
      color: var(--text-color);
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 0;
    }

    .track-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background-color: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
